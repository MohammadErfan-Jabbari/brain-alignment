[project]
name = "brain-alignment"
version = "0.0.0"
description = "Brain-alignment-guided methods for LLMs (master's thesis, UC3M). Distillation is the first use case of the LLM-to-brain mapping."
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.0",
    "huggingface-hub>=1.18.0",
    "matplotlib>=3.10.9",
    "nibabel>=5.4.2",
    "nilearn>=0.13.1",
    "peft>=0.19.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "tables>=3.11.1",
    "torch>=2.11.0",
    "transformers>=5.10.2",
    "wordfreq>=3.1.1",
]

# This is a research environment, not a distributable package.
# `package = false` keeps uv from trying to build/install this directory,
# so we get a clean venv with no src/ layout or sample modules.
# Add libraries as we go with `uv add <pkg>`; always run code with `uv run`.
[tool.uv]
package = false

# Pin torch (and friends) to the CUDA 12.8 wheel index when we add them,
# matching the proven setup on this box (see brain-jepa). Ready in advance.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
